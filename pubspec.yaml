name: cms
description: A new Flutter project.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=2.18.5 <3.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Core packages
  cupertino_icons: ^1.0.5
  firebase_core: ^3.12.1
  cloud_firestore: ^5.6.5
  firebase_auth: ^5.5.1
  fluttertoast: ^8.2.2
  permission_handler: ^11.4.0
  
  # State management
  shared_preferences: ^2.5.2
  riverpod: ^2.3.6
  flutter_riverpod: ^2.3.6
  provider: ^6.0.5
  
  # UI components
  multi_select_flutter: ^4.1.3
  syncfusion_flutter_datepicker: ^28.2.12
  bottom_navy_bar: ^6.0.0
  shimmer: ^3.0.0
  flutter_native_splash: ^2.3.2
  loading_animation_widget: ^1.2.0+4
  flutter_svg: ^2.0.7
  google_fonts: ^6.2.1
  lottie: ^3.3.0
  
  # Firebase services
  firebase_messaging: ^15.2.4
  firebase_storage: ^12.4.4
  
  # Notifications
  
  
  # File handling
  file_picker: ^9.2.1
  path_provider: ^2.1.1
  excel: ^4.0.6
  flutter_pdfview: ^1.3.1
  
  # URL and external services
  url_launcher: ^6.1.12
  
  # Utilities
  uuid: ^4.5.1
  intl: ^0.20.2
  
  # Image handling
  image_picker: ^1.0.4
  cached_network_image: ^3.2.3
  
  # Charts and visualization
  fl_chart: ^0.70.2
  
  # ML and AI
  google_mlkit_text_recognition:
  speech_to_text: ^7.0.0
  google_speech: ^4.2.2
  deepgram_speech_to_text: ^3.0.3
  google_generative_ai: 0.4.6
  share_plus: ^10.1.4
  flutter_markdown: ^0.7.6+2
  animated_text_kit: ^4.2.3
  audio_waveforms: ^1.3.0
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/
  
  fonts:
    - family: Montserrat
      fonts:
        - asset: fonts/Montserrat-Regular.ttf
        - asset: fonts/Montserrat-Italic.ttf
          style: italic
        - asset: fonts/Montserrat-Bold.ttf
          weight: 700